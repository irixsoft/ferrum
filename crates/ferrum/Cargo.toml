[package]
name = "ferrum"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "ferrum"
path = "src/lib.rs"

[[bin]]
name = "ferrum"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
clap.workspace = true
ferrum-core = { path = "../ferrum-core" }
ferrum-platform = { path = "../ferrum-platform" }
mimalloc.workspace = true
mime_guess.workspace = true
reqwest.workspace = true
rmcp = { version = "2.2", default-features = false, features = ["server", "macros", "transport-streamable-http-server"] }
rust-embed.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-stream = "0.1"
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
webauthn-rs.workspace = true
webauthn-rs-proto.workspace = true

[dev-dependencies]
chrono.workspace = true
flate2 = "1"
rsa = { version = "0.9", features = ["getrandom"] }
sqlx.workspace = true
tar = "0.4"
tempfile = "3"
tokio = { workspace = true, features = ["net"] }
tower = "0.5"
uuid.workspace = true
webauthn-authenticator-rs = { version = "=0.6.1-dev", default-features = false, features = ["softpasskey"] }
