name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"

jobs:
  guard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: The tag names the version the tree declares
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "ferrum") | .version')
          panel=$(jq -r .version web/package.json)
          echo "tag=$tag Cargo.toml=$manifest web/package.json=$panel"
          [ "$tag" = "$manifest" ] && [ "$tag" = "$panel" ]

  panel:
    needs: guard
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
        env:
          FERRUM_BUILD_ID: ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: panel
          path: web/dist
          if-no-files-found: error

  build:
    needs: panel
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: panel
          path: web/dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ziglang
      - run: cargo install cargo-zigbuild --locked
      - name: Build
        env:
          FERRUM_BUILD_ID: ${{ github.sha }}
          FERRUM_COMMIT_SHA: ${{ github.sha }}
        run: cargo zigbuild --release --target ${{ matrix.target }} -p ferrum
      - run: cp target/${{ matrix.target }}/release/ferrum ferrum-${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ferrum-${{ matrix.target }}
          path: ferrum-${{ matrix.target }}

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: ferrum-*
          merge-multiple: true
          path: .
      - name: Checksum
        run: sha256sum ferrum-*-unknown-linux-musl > SHA256SUMS
      - name: Sign
        env:
          KEY: ${{ secrets.FERRUM_SIGNING_KEY }}
        run: |
          printf '%s' "$KEY" > key.pem
          openssl pkeyutl -sign -inkey key.pem -rawin -in SHA256SUMS -out SHA256SUMS.sig
          shred -u key.pem
          openssl pkeyutl -verify -pubin -inkey packaging/ferrum-pub.pem \
            -rawin -in SHA256SUMS -sigfile SHA256SUMS.sig
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ferrum-x86_64-unknown-linux-musl
            ferrum-aarch64-unknown-linux-musl
            SHA256SUMS
            SHA256SUMS.sig
            packaging/ferrum-pub.pem
